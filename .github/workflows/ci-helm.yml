name: Validate and publish Helm chart

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/jobbot3000/**"
      - "scripts/validate-helm.sh"
      - "scripts/helm-publication-contract.mjs"
      - "test/helm-publication-contract.test.js"
      - "docs/helm-publication-contract.md"
      - ".github/workflows/ci-helm.yml"
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  validate:
    name: Helm lint and template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      chart_name: ${{ steps.chart.outputs.chart_name }}
      chart_version: ${{ steps.chart.outputs.chart_version }}
      chart_ref: ${{ steps.chart.outputs.chart_ref }}
      coordinate_key: ${{ steps.chart.outputs.coordinate_key }}
      archive_sha256: ${{ steps.sealed.outputs.archive_sha256 }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      publish: ${{ steps.chart.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Read chart metadata
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          node scripts/helm-publication-contract.mjs metadata
          publish="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
              publish="true"
            elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r -m "${GITHUB_SHA}")"
              if grep -Eq '^(charts/jobbot3000/|scripts/validate-helm\.sh$|\.github/workflows/ci-helm\.yml$)' <<< "${changed_files}"; then
                publish="true"
              fi
            fi
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Package chart once
        id: packaged
        env:
          CHART_NAME: ${{ steps.chart.outputs.chart_name }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          CHART_REF: ${{ steps.chart.outputs.chart_ref }}
        shell: bash
        run: |
          set -euo pipefail
          HELM_DIST="${RUNNER_TEMP}/helm-validated"
          echo "HELM_DIST=${HELM_DIST}" >> "${GITHUB_ENV}"
          mkdir "${HELM_DIST}"
          helm package charts/jobbot3000 --destination "${HELM_DIST}"
          node scripts/helm-publication-contract.mjs fingerprint "${HELM_DIST}"

      - name: Validate exact chart archive
        env:
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
        run: scripts/validate-helm.sh "${HELM_DIST}/jobbot3000-${CHART_VERSION}.tgz" charts/jobbot3000/ci

      - name: Seal validated archive
        id: sealed
        env:
          CHART_NAME: ${{ steps.chart.outputs.chart_name }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          CHART_REF: ${{ steps.chart.outputs.chart_ref }}
          ARCHIVE_SHA256: ${{ steps.packaged.outputs.archive_sha256 }}
        run: node scripts/helm-publication-contract.mjs seal "${HELM_DIST}"

      - name: Upload validated archive and manifest
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.chart.outputs.artifact_name }}
          path: ${{ env.HELM_DIST }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize Helm validation
        env:
          CHART_REF: ${{ steps.chart.outputs.chart_ref }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          ARCHIVE_SHA256: ${{ steps.sealed.outputs.archive_sha256 }}
          PUBLISH: ${{ steps.chart.outputs.publish }}
        shell: bash
        run: |
          {
            echo "## jobbot3000 Helm chart validation"
            echo ""
            echo "Chart: ${CHART_REF}:${CHART_VERSION}"
            echo "Archive SHA-256: ${ARCHIVE_SHA256}"
            echo "Validated the packaged archive: helm lint, default, staging, and production renders."
            echo "Publish candidate: ${PUBLISH}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish OCI chart
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    concurrency:
      group: helm-publish-${{ needs.validate.outputs.coordinate_key }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      CHART_NAME: ${{ needs.validate.outputs.chart_name }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      CHART_REF: ${{ needs.validate.outputs.chart_ref }}
      ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
    steps:
      - name: Check out exact source for the verification helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Download this run's validated artifact by ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/helm-publication

      - name: Set downloaded archive directory
        shell: bash
        run: echo "HELM_DIST=${RUNNER_TEMP}/helm-publication" >> "${GITHUB_ENV}"

      - name: Verify exact validated archive before authentication
        run: node scripts/helm-publication-contract.mjs verify "${HELM_DIST}"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Require definitive authenticated absence and push validated bytes
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/helm-publication-contract.mjs publish "${HELM_DIST}"

      - name: Summarize published chart
        shell: bash
        run: |
          {
            echo "## jobbot3000 Helm chart published"
            echo ""
            echo "Published chart: ${CHART_REF}:${CHART_VERSION}"
            echo "Archive SHA-256: ${ARCHIVE_SHA256}"
            echo "Source SHA: ${GITHUB_SHA}"
            echo "Pin the chart coordinate separately from the immutable application image tag."
          } >> "${GITHUB_STEP_SUMMARY}"
